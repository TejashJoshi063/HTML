<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }
        .profile-card {
            background-color: rgb(255, 255, 255);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        .profile-card img {
            border-radius: 50%;
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
        .profile-card h2 {
            margin: 10px 0;
            font-size: 1.5em;
        }
        .profile-card p {
            color: #10eccf;
            margin-bottom: 10px;
        }
        .profile-card a {
            color: #71db34;
            text-decoration: none;
        }
        .profile-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <img src="images/Naruto.jpg" alt="Profile Picture">
        <h2>Tejash Joshi</h2>
        <p>My name is Tejash Joshi</p>
        <p>I am a student of class 8th</p>
        <p>My hobbies are Coding, Gaming, etc.</p>
        <p>My email:</p>
        <a href="mailto:tejashjoshi708@gmail.com">tejashjoshi708@gmail.com</a>
    </div>
</body>
</html>
